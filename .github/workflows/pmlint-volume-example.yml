# Reusable: pmlint check on a volume repository PR
#
# Copy this workflow into a volume repo as `.github/workflows/pmlint.yml`,
# or call it via workflow_call after adjusting paths.
#
# Expects volume contents at the repository root (PDFs + .bib) for
# pre-publication PRs. pmlint itself skips (exit 0) when gh-pages already
# exists — i.e. the volume has been published.

name: pmlint

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout volume
        uses: actions/checkout@v4

      - name: Checkout papersite tooling
        uses: actions/checkout@v4
        with:
          repository: mlresearch/papersite
          path: .papersite-tools
          # Pin for reproducibility if desired: ref: <sha>

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Run pmlint --check
        env:
          PAPERSITE_ROOT: ${{ github.workspace }}/.papersite-tools
          PMLINT_SKIP_UPDATE: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash "$PAPERSITE_ROOT/bin/pmlint" --check
