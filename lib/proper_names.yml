# Proper names and acronyms that should keep their capitals in BibTeX titles.
#
# Used by CIP-000B title bracing checks (intake). Matching is whole-word only;
# the checker does not auto-grow this list.
#
# A stem is considered protected in a title if any of these appear:
#   - {X}rest   e.g. {B}ayes, {B}ayesian
#   - {Stem}    e.g. {Bayes}, {SVM}
#
# Schema (each list entry):
#   stem:  string (required) — canonical token to match
#   kind:  name | acronym     — reporting / docs only
#   notes: string             — optional curation note
#
# Source: curated from cip/cip000B/ scan (2026-10-04), not an auto-dump of
# Title Case tokens from _posts.

stems:
