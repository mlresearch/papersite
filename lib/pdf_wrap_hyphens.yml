# PDF line-wrap hyphen repair lists
#
# Used by lib/pdf_wrap_hyphens.rb (check_volume + tidy_bibtex --fix-wrap-hyphens).
# Edit this file to curate join-vs-keep decisions; do not hardcode lists in Ruby.
#
# Pattern matched in BibTeX text: letter(s), ASCII "-", space, lowercase…
#   knowl- edge          → join (TeX hyphenation point, or default)
#   state- of-the-art    → keep hyphen (right already hyphenated)
#   semi- supervised     → keep hyphen (right token in compound_right)
#   in- variant          → join (TeX overrides function_left)
#   to- program          → drop hyphen, keep space (function_left; not a TeX break)
#
# Decision order: compound continuation / compound_right → TeX join →
# function_left → default join. A join is kept only if the compressed form
# is an English word, or both sides are long (wrapped names / technical
# terms). Short non-words stay hyphenated (abc- mart → abc-mart, not abcmart).
# Missing TeX files fail open (default join). Disable TeX with
# tex_hyphenation.enabled: false or PMLR_DISABLE_TEX_HYPHEN=1.
#
# See backlog 2026-10-05_pdf-wrap-hyphens-yaml-tex-soak.

# Vendored Liang patterns (lib/hyphenation/; see NOTICE there). Paths are
# relative to lib/ unless absolute.
tex_hyphenation:
  enabled: true
  patterns: hyphenation/hyph-en-us.pat.txt
  exceptions: hyphenation/hyph-en-us.hyp.txt
  left_min: 2
  right_min: 3

# Join-confidence word list (see lib/hyphenation/NOTICE). extras are closed
# forms Webster lacks that we still want to join (co- ordinate → coordinate).
dictionary:
  enabled: true
  words: hyphenation/words-en.txt.gz
  extras:
    - coordinate
    - coordinated
    - coordinates
    - coordinating
    - dataset
    - datasets
    - email
    - emails
    - metadata
    - offline
    - online
    - webpage
    - website

# Left tokens that are function words, not fragments. Erroneous hyphen before
# the next word: "to- program" → "to program" (not "toprogram").
function_left:
  - a
  - an
  - and
  - as
  - at
  - by
  - for
  - from
  - in
  - into
  - of
  - on
  - onto
  - or
  - the
  - to
  - upon
  - with

# Right-hand halves of common hyphenated compounds in ML/stats abstracts.
# Prefer listing the right side over left prefixes: short prefixes like
# re-/co-/multi- are also common mid-word syllable breaks
# ("re- lationship", "multi- ple", "co- efficient").
